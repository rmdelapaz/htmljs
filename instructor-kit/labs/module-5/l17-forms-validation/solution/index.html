<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="form-container">
        <h1>📋 Create an Account</h1>
        <form id="register-form" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username"
                       placeholder="3–20 characters, letters/numbers/underscores">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email"
                       placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password"
                       placeholder="At least 8 characters">
                <div class="strength-meter" aria-hidden="true">
                    <div class="strength-bar" id="strength-bar"></div>
                </div>
                <span class="strength-text" id="strength-text"></span>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password"
                       placeholder="Re-enter your password">
            </div>
            <button type="submit">Create Account</button>
        </form>
        <div class="success-message" id="success-message" role="status" tabindex="-1">
            ✅ Account created successfully!
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
