<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Persistent To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <div class="app-header">
            <h1>✅ To-Do List</h1>
            <div class="input-row">
                <label for="todo-input" class="visually-hidden">New task</label>
                <input type="text" id="todo-input" placeholder="What needs to be done?">
                <button type="button" id="add-btn">Add</button>
            </div>
        </div>

        <ul class="todo-list" id="todo-list"></ul>

        <div class="app-footer">
            <span id="count-display" aria-live="polite">0 items left</span>
            <button type="button" class="clear-btn" id="clear-done-btn">Clear completed</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
