<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack Budget</title>
  <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>🍿 Snack Budget</h1>
        <p class="lead">Track this week's snack spending. Mark an item <b>Bought</b> to count it.</p>

        <dl class="totals">
            <div><dt>Weekly limit</dt><dd id="limit">$0.00</dd></div>
            <div><dt>Spent</dt><dd id="spent">$0.00</dd></div>
            <div><dt>Left</dt><dd id="left">$0.00</dd></div>
        </dl>

        <form id="item-form" class="add-form" novalidate>
            <div class="field">
                <label for="item-name">Item</label>
                <input type="text" id="item-name" autocomplete="off">
            </div>
            <div class="field">
                <label for="item-price">Price ($)</label>
                <input type="number" id="item-price" min="0" step="0.01" inputmode="decimal">
            </div>
            <button type="submit">Add</button>
        </form>

        <div class="list-head">
            <h2>Shopping list <span id="item-count" class="count">0 items</span></h2>
            <button type="button" id="load-samples" class="secondary">Load sample items</button>
        </div>
        <ul id="item-list" class="item-list"></ul>

        <p id="status" class="status" role="status"></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
