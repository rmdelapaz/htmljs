<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>JS Practice</title>
    <style>
        /* instructor add-on: on-page copy of the console output (see console-mirror.js).
           Students' own index.html doesn't need this block. */
        body { font-family: system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem;
               line-height: 1.6; color: #1a202c; background: #ffffff; }
        #console-mirror { background: #0f1729; color: #e8eefc; border-radius: 8px; padding: .75rem 1rem;
                          font: .9rem/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
        #console-mirror .lvl { display: inline-block; min-width: 3.5rem; color: #93c5fd; }
        #console-mirror .warn .lvl { color: #fcd34d; }
        #console-mirror .error .lvl { color: #fca5a5; }
    </style>
</head>
<body>
    <h1>JavaScript Practice</h1>
    <p>Open the console to see messages.</p>
    <p><small>Checkpoint after L03 — app.js adds the user profile (L02 section kept above it).</small></p>

    <!-- instructor add-on: mirrors the console onto the page for the projector -->
    <section aria-labelledby="mirror-heading">
        <h2 id="mirror-heading">Console output (mirrored)</h2>
        <div id="console-mirror" role="log" aria-live="polite"></div>
    </section>
    <script src="console-mirror.js"></script>

    <script src="app.js"></script>
</body>
</html>
